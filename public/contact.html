<!doctype html>
<html lang="en">
<head>
<title>Contact — Rosaryo</title>
<meta name="description" content="Contact Rosaryo.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a33">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<main id="main" class="wrap contact-page">
  <p class="eyebrow">// Get in Touch</p>
  <h1>Tell me about the project.</h1>
  <p class="contact-intro">Fill in the details below and send your inquiry directly to my inbox.</p>

  <form id="contact-form">
    <input type="hidden" name="access_key" value="aab7c008-8dae-4299-bb61-12d12a5a22b7">
    <input type="hidden" name="from_name" value="Rosaryo Website">
    <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
    <div class="form-grid">
      <label>Full Name *<input name="name" required placeholder="Juan Dela Cruz"></label>
      <label>Subject *<input name="subject" required placeholder="e.g. Rosaryo inquiry"></label>
      <label>Company Name<input name="company" placeholder="Optional"></label>
      <label>Contact Email *<input name="email" type="email" required placeholder="you@company.com"></label>
      <label>Mobile Number<input name="mobile" type="tel" placeholder="Optional"></label>
      <label class="full-field">Inquiry / Comments *<textarea name="message" required placeholder="How can I help?"></textarea></label>
      <label class="full-field">Security Check *<span id="captcha-question"></span><input id="captcha-answer" name="captcha" required inputmode="numeric" placeholder="Answer"></label>
    </div>
    <button class="contact-submit" type="submit">Send Inquiry →</button>
  </form>
</main>

<div id="site-footer"></div>
<script src="header.js"></script>
<script src="footer.js"></script>
<script src="contact.js"></script>
<script src="theme.js"></script>
<script src="gcash.js"></script>
<script src="cookies.js"></script>
</body>
</html>
